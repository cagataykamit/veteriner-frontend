<!doctype html>
<html lang="tr">
    <head>
        <meta charset="utf-8" />
        <title>Vetinity — Veteriner klinik programı: günün akışı, kayıt defterleri, KVKK</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Veteriner kliniğinizin gününü tek ekranda yönetin: geliş, muayene, tahsilat, aşı ve ilaç kayıt defterleri, KVKK formları. 14 gün ücretsiz, kart gerekmez."
        />
        <link rel="canonical" href="https://www.vetinity.com/" />
        <meta property="og:site_name" content="Vetinity" />
        <meta property="og:locale" content="tr_TR" />
        <meta property="og:image" content="https://www.vetinity.com/marketing/og-image.jpg" />
        <meta name="twitter:card" content="summary_large_image" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <!-- Ana ekrana eklenen klinik paneli (PWA, MOBILE-004): başlangıç /panel; service worker yalnız uygulama kabuğunu önbelleğe alır -->
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
        <meta name="theme-color" content="#0fa39a" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Vetinity" />
    </head>

    <body>
        <script>
            (function () {
                try {
                    var theme = localStorage.getItem('vetinity-theme');
                    if (theme === 'dark' || localStorage.getItem('vetinity.darkTheme') === 'true') {
                        document.documentElement.classList.add('app-dark');
                    }
                } catch (e) {}
            })();
        </script>
        <app-root></app-root>
    </body>
</html>
