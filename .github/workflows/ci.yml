name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test, artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Lock dosyası yerelde npm 11.6.4 ile yazılır; npm sürümleri isteğe bağlı eş bağımlılıkları farklı çözebilir
      # (npm 10'da `npm ci` "Missing: chokidar@5.0.0 from lock file" ile reddediyordu). Yerelle aynı npm sabitlenir.
      - name: Use npm 11
        run: npm install -g npm@11.6.4

      # Sürüm kuralı: v<MAJOR>.<MINOR>.<PATCH>[-önsürüm] etiketi → sürüm. Etiketsiz koşu: 0.0.0-ci.<koşu no>.
      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Etiket SemVer olmalı (örn. v1.2.3 veya v1.2.3-rc.1): $tag"
              exit 1
            fi
            version="${tag#v}"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Sürüm: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Install
        run: npm ci

      # PrimeNG 22 lisans anahtarı depo GİZLİ değişkeninden: Settings → Secrets and variables → Actions → Secrets → PRIMEUI_LICENSE.
      # Tanımsızsa derleme sürer ama uygulama "Invalid PrimeUI License" uyarısı gösterir; sürüm (etiket) derlemesinde hatadır.
      - name: PrimeUI license
        env:
          PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
        run: |
          if [ -n "$PRIMEUI_LICENSE" ]; then
            node scripts/primeui-license.mjs
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Sürüm derlemesi için PRIMEUI_LICENSE gizli değişkeni tanımlı olmalı."
            exit 1
          else
            echo "::warning::PRIMEUI_LICENSE tanımlı değil; derlenen uygulama lisans uyarısı gösterir."
          fi

      - name: Lint
        run: npm run lint

      # Kritik açık koşuyu düşürür; yüksek seviye yalnız uyarı olarak raporlanır
      # (geliştirme araçlarındaki geçişli paketler majör yükseltme gerektirebilir).
      - name: Dependency audit
        run: |
          npm audit --audit-level=critical
          npm audit --audit-level=high || echo "::warning::npm audit: yüksek seviyeli açık var (ayrıntı yukarıda)."

      # Üretim API adresi depo DEĞİŞKENİ (gizli değil): Settings → Secrets and variables → Actions → Variables → API_BASE_URL.
      # Betik panelin apiBaseUrl'ini ve portalın portalApiBaseUrl'ini (…/api/portal/v1) birlikte yazar; iki build de bu adımdan sonra.
      # Tanımsızsa derleme depodaki varsayılanla sürer; etiket (sürüm) derlemesinde tanımsızlık hatadır.
      - name: Set production API URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            node scripts/set-api-base-url.mjs
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Sürüm derlemesi için API_BASE_URL deposu değişkeni tanımlı olmalı."
            exit 1
          else
            echo "::warning::API_BASE_URL tanımlı değil; panel ve portal environment.ts içindeki varsayılan localhost API adresi kullanılacak (dağıtılabilir değil)."
          fi

      - name: Build (production)
        run: npx ng build --configuration production

      - name: Build portal (production)
        run: npx ng build portal --configuration production

      # Proje verilmeyince her iki projenin (panel + portal) testleri koşar. Vitest tarayıcı kipi (Playwright, başlıksız
      # Chromium): runner'daki Google Chrome kullanılır (CHROME_BIN), Playwright tarayıcısı indirilmez.
      - name: Test (headless)
        run: |
          export CHROME_BIN="${CHROME_BIN:-$(command -v google-chrome)}"
          npx ng test --watch=false

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-${{ steps.version.outputs.version }}
          path: dist
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 30 }}
