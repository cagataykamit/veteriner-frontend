<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Vetinity — veteriner kliniğinizin günü tek ekranda">
    <!-- Yer tutucu OG görseli (WEB-003). WEB-005 ile gerçek Bugün ekranı 1200×630 PNG olarak değiştirilecek. -->
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#061224" />
            <stop offset="0.45" stop-color="#0b1d3a" />
            <stop offset="1" stop-color="#0d5f63" />
        </linearGradient>
    </defs>
    <rect width="1200" height="630" fill="url(#bg)" />
    <text x="80" y="250" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">Vetinity</text>
    <text x="80" y="330" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="600" fill="#ffffff">Veteriner kliniğinizin günü tek ekranda</text>
    <text x="80" y="400" font-family="Inter, Arial, sans-serif" font-size="26" fill="#7ed3ca">Geliş · Muayene · Tahsilat · Kayıt defterleri · KVKK</text>
    <text x="80" y="560" font-family="Inter, Arial, sans-serif" font-size="22" fill="#b8c4d6">14 gün ücretsiz · kart gerekmez</text>
</svg>
